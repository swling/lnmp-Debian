# Managed by LNMP Debian. Configure the root in /etc/lnmp-debian.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root @DEFAULT_WEB_ROOT@;
    index index.html index.htm index.php;

    include snippets/enable-php.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /.well-known {
        allow all;
    }

    location ~ /\. {
        deny all;
    }
}
