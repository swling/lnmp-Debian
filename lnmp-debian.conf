# Parent directory used as the default for newly created virtual hosts.
WEB_ROOT="/home/wwwroot"
# Default Nginx website root (the old Default_Website_Dir setting).
DEFAULT_WEB_ROOT="/home/wwwroot/default"
NGINX_LOG_DIR="/var/log/nginx"
MYSQL_DATA_DIR="/var/lib/mysql"

# Optional defaults. Leave empty to select from versions available in APT.
PHP_VERSION=""
NGINX_VERSION=""
MYSQL_VERSION=""