# Parent directory used as the default for newly created virtual hosts.
WEB_ROOT="/home/wwwroot"
# Default Nginx website root (the old Default_Website_Dir setting).
DEFAULT_WEB_ROOT="/home/wwwroot/default"
NGINX_LOG_DIR="/var/log/nginx"
MYSQL_DATA_DIR="/var/lib/mysql"

# Optional defaults. Leave empty to select from versions available in the
# configured repositories (PHP: Debian, Nginx: nginx.org, MySQL: Oracle).
PHP_VERSION=""
NGINX_VERSION=""
MYSQL_VERSION=""

# Nginx official repository channel: stable (default) or mainline.
NGINX_CHANNEL="stable"